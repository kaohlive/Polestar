<!DOCTYPE html>
<html>

<head>
	<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
	<style type="text/css">
		.tg {
			border-collapse: collapse;
			border-color: #ccc;
			border-spacing: 0;
			margin: 0px auto;
		}

		.tg td {
			background-color: #fff;
			border-color: #ccc;
			border-style: solid;
			border-width: 1px;
			color: #333;
			font-family: Arial, sans-serif;
			font-size: 14px;
			overflow: hidden;
			padding: 10px 5px;
			word-break: normal;
		}

		.tg th {
			background-color: #f0f0f0;
			border-color: #ccc;
			border-style: solid;
			border-width: 1px;
			color: #333;
			font-family: Arial, sans-serif;
			font-size: 14px;
			font-weight: normal;
			overflow: hidden;
			padding: 10px 5px;
			word-break: normal;
		}

		.tg .tg-baqh {
			text-align: center;
			vertical-align: top
		}

		.tg .tg-rz9m {
			position: -webkit-sticky;
			position: sticky;
			text-align: center;
			top: -1px;
			vertical-align: top;
			will-change: transform
		}

		.tg .tg-0lax {
			text-align: left;
			vertical-align: top
		}

		@media screen and (max-width: 767px) {
			.tg {
				width: auto !important;
			}

			.tg col {
				width: auto !important;
			}

			.tg-wrap {
				overflow-x: auto;
				-webkit-overflow-scrolling: touch;
				margin: auto 0px;
			}
		}

		/* Style the tab */
		.tab {
			overflow: hidden;
			border: 1px solid #ccc;
			background-color: #f1f1f1;
		}

		/* Style the buttons that are used to open the tab content */
		.tab button {
			background-color: inherit;
			float: left;
			border: none;
			outline: none;
			cursor: pointer;
			padding: 14px 16px;
			transition: 0.3s;
		}

		/* Change background color of buttons on hover */
		.tab button:hover {
			background-color: #ddd;
		}

		/* Create an active/current tablink class */
		.tab button.active {
			background-color: #ccc;
		}

		/* Style the tab content */
		.tabcontent {
			display: none;
			padding: 6px 12px;
			border: 1px solid #ccc;
			border-top: none;
		}

		.tabcontent {
			animation: fadeEffect 1s;
			/* Fading effect takes 1 second */
		}

		/* Go from zero to full opacity */
		@keyframes fadeEffect {
			from {
				opacity: 0;
			}

			to {
				opacity: 1;
			}
		}
	</style>
</head>

<body>
	<div class="tab">
		<button class="tablinks" data-tabname="account"><span data-i18n="Polestar2.settings.tabs.account"></span></button>
		<button class="tablinks" data-tabname="eu"><span data-i18n="Polestar2.settings.tabs.eu"></span></button>
		<button class="tablinks" data-tabname="auth"><span data-i18n="Polestar2.settings.tabs.auth"></span></button>
		<button class="tablinks" data-tabname="debug"><span data-i18n="Polestar2.settings.tabs.debug"></span></button>
	</div>

	<div id="account" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<header class="homey-header">
				<h1 class="homey-title" data-i18n="Polestar2.settings.account.title"></h1>
			</header>
			<form>
				<div class="homey-form-group">
					<label class="homey-form-label" for="email" data-i18n="Polestar2.settings.account.email"></label>
					<input class="homey-form-input" id="email" type="text" value="" />
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="password"
						data-i18n="Polestar2.settings.account.password"></label>
					<input class="homey-form-input" id="password" type="password" value="" autocomplete="new-password" />
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="distanceUnit"
						data-i18n="Polestar2.settings.account.distanceUnit"></label>
					<select class="homey-form-input" id="distanceUnit">
						<option value="km" data-i18n="Polestar2.settings.account.distanceUnitKm"></option>
						<option value="miles" data-i18n="Polestar2.settings.account.distanceUnitMiles"></option>
					</select>
				</div>
				<button id="save" type="submit" class="homey-button-primary-full"
					data-i18n="Polestar2.settings.account.saveBtn"></button>
			</form>
		</fieldset>
	</div>

	<div id="eu" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<header class="homey-header">
				<h1 class="homey-title" data-i18n="Polestar2.settings.eu.title"></h1>
				<p class="homey-subtitle" data-i18n="Polestar2.settings.eu.intro"></p>
			</header>
			<form>
				<div class="homey-form-group">
					<label class="homey-form-checkbox">
						<input class="homey-form-checkbox-input" id="euEnabled" type="checkbox" />
						<span class="homey-form-checkbox-checkmark"></span>
						<span class="homey-form-checkbox-text" data-i18n="Polestar2.settings.eu.enable"></span>
					</label>
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="euClientId" data-i18n="Polestar2.settings.eu.clientId"></label>
					<input class="homey-form-input" id="euClientId" type="text" value="" autocomplete="off" />
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="euClientSecret" data-i18n="Polestar2.settings.eu.clientSecret"></label>
					<input class="homey-form-input" id="euClientSecret" type="password" value="" autocomplete="new-password" />
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="euAccountId" data-i18n="Polestar2.settings.eu.accountId"></label>
					<input class="homey-form-input" id="euAccountId" type="text" value="" autocomplete="off" />
				</div>
				<p id="euStatus"></p>
				<button id="euSave" type="submit" class="homey-button-primary-full"
					data-i18n="Polestar2.settings.eu.saveBtn"></button>
			</form>
		</fieldset>
	</div>

	<div id="auth" class="tabcontent">
		<header class="homey-header">
			<h1 class="homey-title" data-i18n="Polestar2.settings.auth.title"></h1>
			<p class="homey-subtitle" data-i18n="Polestar2.settings.auth.intro"></p>
		</header>
		<div class="tg-wrap">
			<table class="tg">
				<thead>
					<tr>
						<th class="tg-0lax" style="text-align:center"><b><span data-i18n="Polestar2.settings.debug.registered"></span></b></th>
						<th class="tg-0lax" style="text-align:center"><b><span data-i18n="Polestar2.settings.auth.event"></span></b></th>
						<th class="tg-0lax" style="text-align:center"><b><span data-i18n="Polestar2.settings.auth.source"></span></b></th>
						<th class="tg-0lax" style="text-align:center" width="50%"><b><span data-i18n="Polestar2.settings.auth.detail"></span></b></th>
					</tr>
				</thead>
				<tbody id="authLogs"></tbody>
			</table>
		</div>
		<p id="authEmpty" data-i18n="Polestar2.settings.auth.empty"></p>
		<button id="authClear" class="homey-button-secondary-full" data-i18n="Polestar2.settings.auth.clearBtn"></button>
	</div>

	<div id="debug" class="tabcontent">
		<header class="homey-header">
			<h1 class="homey-title" data-i18n="Polestar2.settings.debug.title"></h1>
		</header>
		<div class="tg-wrap">
			<table class="tg">
				<thead>
					<tr>
						<th class="tg-0lax" style="text-align:center">
							<b>
								<span data-i18n="Polestar2.settings.debug.registered"></span>
							</b>
						</th>
						<th class="tg-0lax" style="text-align:center">
							<b>
								<span data-i18n="Polestar2.settings.debug.severity"></span>
							</b>
						</th>
						<th class="tg-0lax" style="text-align:center" width="60%">
							<b>
								<span data-i18n="Polestar2.settings.debug.message"></span>
							</b>
						</th>
					</tr>
				</thead>
				<tbody id="logs"></tbody>
			</table>
		</div>
	</div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"
	integrity="sha512-3gJwYpMe3QewGELv8k/BX9vcqhryRdzRMxVfq6ngyWXwo03GFEzjsUm8Q7RZcHPHksttq7/GFoxjCVUjkjvPdw=="
	crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="text/javascript">
	document.addEventListener('DOMContentLoaded', () => {
		function openTab(tabName) {
			for (const el of document.getElementsByClassName('tabcontent')) el.style.display = 'none';
			for (const btn of document.getElementsByClassName('tablinks')) {
				btn.classList.toggle('active', btn.getAttribute('data-tabname') === tabName);
			}
			const tab = document.getElementById(tabName);
			if (tab) tab.style.display = 'block';
		}
		document.querySelectorAll('.tablinks').forEach((button) => {
			button.addEventListener('click', () => openTab(button.getAttribute('data-tabname')));
		});
		openTab('account');
	});

	function severityHtml(severity) {
		const color = severity === 'ERROR' ? 'red' : severity === 'WARNING' ? 'orange' : 'blue';
		return $('<span>').css('color', color).append($('<b>').text(severity));
	}

	function onHomeyReady(Homey) {
		Homey.ready();

		// ---- Debug log ----
		function addLogEntry(registered, severity, message, data) {
			let msg = $('<b>').text(message);
			if (data != null) msg = msg.add($('<br>')).add($('<code>').text(JSON.stringify(data, ' ', 1)));
			const row = $('<tr>').addClass('event')
				.append($('<td style="text-align:center">').text(registered))
				.append($('<td style="text-align:center">').append(severityHtml(severity)))
				.append($('<td>').append(msg));
			$('#logs').prepend(row);
		}
		Homey.get('debugLog', (error, value) => {
			if (error) return console.error(error);
			(value || []).forEach((item) => addLogEntry(item.registered, item.severity, item.message, item.data));
		});
		Homey.on('debugLog', (item) => addLogEntry(item.registered, item.severity, item.message, item.data));

		// ---- Auth log ----
		function addAuthEntry(item) {
			$('#authEmpty').hide();
			const detail = item.detail && Object.keys(item.detail).length ? JSON.stringify(item.detail, ' ', 1) : '';
			const row = $('<tr>')
				.append($('<td style="text-align:center">').text(item.registered))
				.append($('<td style="text-align:center">').append(severityHtml(item.severity)).append($('<br>')).append($('<span>').text(item.type)))
				.append($('<td style="text-align:center">').text(item.source || ''))
				.append($('<td>').append($('<code>').text(detail)));
			$('#authLogs').prepend(row);
		}
		Homey.get('authLog', (error, value) => {
			if (error) return console.error(error);
			const list = value || [];
			if (list.length === 0) $('#authEmpty').show(); else $('#authEmpty').hide();
			list.forEach(addAuthEntry);
		});
		Homey.on('authLog', addAuthEntry);
		document.getElementById('authClear').addEventListener('click', () => {
			Homey.api('POST', '/authlog/clear', {}, (err) => {
				if (err) return Homey.alert(err.message || String(err));
				$('#authLogs').empty();
				$('#authEmpty').show();
			});
		});

		// ---- Account ----
		const emailElement = document.getElementById('email');
		const passwordElement = document.getElementById('password');
		const distanceUnitElement = document.getElementById('distanceUnit');
		passwordElement.placeholder = Homey.__('Polestar2.settings.account.passwordPlaceholder');

		Homey.get('user_email', (err, username) => {
			if (err) return Homey.alert(err);
			emailElement.value = username || '';
		});
		Homey.get('distance_unit', (err, distanceUnit) => {
			if (err) return Homey.alert(err);
			distanceUnitElement.value = distanceUnit || 'km';
		});

		document.getElementById('save').addEventListener('click', (e) => {
			e.preventDefault();
			// Through the app API so the password is encrypted before it is
			// stored; an empty field keeps the stored password.
			Homey.api('POST', '/account', {
				email: emailElement.value,
				password: passwordElement.value || null,
				distanceUnit: distanceUnitElement.value,
			}, (err) => {
				if (err) return Homey.alert(err.message || String(err));
				passwordElement.value = '';
				Homey.alert(Homey.__({ en: 'Settings saved', no: 'Innstillinger lagret', nl: 'Instellingen opgeslagen' }));
			});
		});

		// ---- EU Data Portal ----
		const euEnabled = document.getElementById('euEnabled');
		const euClientId = document.getElementById('euClientId');
		const euClientSecret = document.getElementById('euClientSecret');
		const euAccountId = document.getElementById('euAccountId');
		const euStatus = document.getElementById('euStatus');
		const euSave = document.getElementById('euSave');

		function showEuStatus(cfg) {
			if (!cfg.enabled) {
				euStatus.textContent = Homey.__('Polestar2.settings.eu.statusOff');
				return;
			}
			const s = cfg.status || {};
			euStatus.textContent = Homey.__('Polestar2.settings.eu.statusOk')
				.replace('{vehicles}', s.vehicles != null ? s.vehicles : '?')
				.replace('{matched}', s.matched != null ? s.matched : '?');
		}
		function loadEu(cfg) {
			euEnabled.checked = !!cfg.enabled;
			euClientId.value = cfg.clientId || '';
			euAccountId.value = cfg.accountId || '';
			euClientSecret.value = '';
			euClientSecret.placeholder = cfg.hasSecret ? Homey.__('Polestar2.settings.eu.secretPlaceholder') : '';
			showEuStatus(cfg);
		}
		Homey.api('GET', '/dataportal', null, (err, cfg) => {
			if (err) return console.error(err);
			loadEu(cfg);
		});
		euSave.addEventListener('click', (e) => {
			e.preventDefault();
			euStatus.textContent = euEnabled.checked ? Homey.__('Polestar2.settings.eu.testing') : '';
			euSave.disabled = true;
			Homey.api('POST', '/dataportal', {
				enabled: euEnabled.checked,
				clientId: euClientId.value,
				clientSecret: euClientSecret.value,
				accountId: euAccountId.value,
			}, (err, cfg) => {
				euSave.disabled = false;
				if (err) {
					euStatus.textContent = Homey.__('Polestar2.settings.eu.failed') + ': ' + (err.message || String(err));
					return;
				}
				loadEu(cfg);
				Homey.alert(Homey.__('Polestar2.settings.eu.saved'));
			});
		});
	}
</script>

</html>
